<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>HELLO WORLD</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/controls.css" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/shaka-player.ui.js" crossorigin="anonymous"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box }
html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif }
.video-container, #player-wrap { position: absolute; inset: 0; background: #000 }
#video { width: 100%; height: 100% }
.shaka-spinner-container, .shaka-buffering-spinner, .shaka-spinner { display: none !important }
</style>
</head>
<body>
<div class="video-container">
  <div id="player-wrap" data-shaka-player-container>
    <video autoplay muted playsinline data-shaka-player id="video"></video>
  </div>
</div>
<script>
function silentLog(msg, err) {
  // Errors go to console only — never shown to the user, never retried
  console.error(msg, err || '');
}

function onPlayerError(error) {
  silentLog('Shaka error (suppressed from UI, no retry)', error);
  // Intentionally do nothing else — leave playback as-is
}

async function initPlayer() {
  if (!window.shaka || !shaka.Player || !shaka.Player.isBrowserSupported()) {
    silentLog('Browser not supported');
    return;
  }
  shaka.polyfill.installAll();
  var video = document.getElementById('video');
  if (!video || !video.ui) { setTimeout(initPlayer, 80); return; }

  var ui = video.ui;
  var controls = ui.getControls();
  var player = controls.getPlayer();

  player.addEventListener('error', function(ev) { onPlayerError(ev.detail); });
  controls.addEventListener('error', function(ev) { onPlayerError(ev.detail); });
  video.addEventListener('error', function() { onPlayerError(video.error); });

  ui.configure({
    controlPanelElements: [
      "play_pause", "mute", "volume", "spacer",
      "time_and_duration", "quality", "fullscreen", "overflow_menu"
    ]
  });

  player.configure({
    drm: {
      clearKeys: {
        "1afc5f853984602e315ac4fcc70b115d": "54966e95b07c30ad7e41b25d50d41bb1"
      }
    },
    streaming: {
      bufferingGoal: 20,
      rebufferingGoal: 2,
      bufferBehind: 20
    }
  });

  try {
    await player.load("https://otte.cache.aiv-cdn.net/pdx-nitro/live/clients/dash/enc/0q2dyjycdn/out/v1/075b9fddd55b4fc481c9ad8c73d1fc81/cenc.mpd");
    video.muted = false;
    video.play().catch(function(){});
  } catch (e) {
    onPlayerError(e);
  }
}

function initFailed() {
  silentLog('Unable to load Shaka UI');
}

document.addEventListener('shaka-ui-loaded', initPlayer);
document.addEventListener('shaka-ui-load-failed', initFailed);

if ('wakeLock' in navigator) {
  navigator.wakeLock.request('screen').catch(function(){});
}
</script>
</body>
</html>
