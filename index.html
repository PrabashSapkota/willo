<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>HELLO WORLD</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/controls.css" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/shaka-player.ui.js" crossorigin="anonymous"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box }
html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; user-select: none; -webkit-user-select: none; }
.video-container, #player-wrap { position: absolute; inset: 0; background: #000 }
#video { width: 100%; height: 100% }
.shaka-spinner-container, .shaka-buffering-spinner, .shaka-spinner { display: none !important }
</style>
</head>
<body>
<div class="video-container">
  <div id="player-wrap" data-shaka-player-container>
    <video autoplay muted playsinline data-shaka-player id="video"></video>
  </div>
</div>
<script>
// Prevent Right-Click Context Menu
document.addEventListener('contextmenu', function(e) {
  e.preventDefault();
}, false);

// Prevent Common DevTools Keyboard Shortcuts
document.addEventListener('keydown', function(e) {
  // F12
  if (e.key === 'F12' || e.keyCode === 123) {
    e.preventDefault();
    return false;
  }
  // Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C, Ctrl+Shift+K
  if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c' || e.key === 'K' || e.key === 'k')) {
    e.preventDefault();
    return false;
  }
  // Ctrl+U (View Source)
  if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) {
    e.preventDefault();
    return false;
  }
  // Cmd+Alt+I, Cmd+Alt+J, Cmd+Alt+U (macOS)
  if (e.metaKey && e.altKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'U' || e.key === 'u')) {
    e.preventDefault();
    return false;
  }
}, false);

// Infinite Debugger Loop Deterrent
(function() {
  function blockDevTools() {
    function debuggerCheck() {
      (function() {
        return false;
      })
      ["constructor"]("debugger")();
    }
    try {
      debuggerCheck();
    } catch (err) {}
  }
  setInterval(blockDevTools, 100);
})();

// Suppress and Override Console Methods
window.console = {
  log: function() {},
  error: function() {},
  warn: function() {},
  info: function() {},
  debug: function() {},
  trace: function() {}
};

function silentLog(msg, err) {
  // Suppressed completely
}

function onPlayerError(error) {
  silentLog('Shaka error (suppressed from UI, no retry)', error);
}

async function initPlayer() {
  if (!window.shaka || !shaka.Player || !shaka.Player.isBrowserSupported()) {
    silentLog('Browser not supported');
    return;
  }
  shaka.polyfill.installAll();
  var video = document.getElementById('video');
  if (!video || !video.ui) { setTimeout(initPlayer, 80); return; }

  var ui = video.ui;
  var controls = ui.getControls();
  var player = controls.getPlayer();

  player.addEventListener('error', function(ev) { onPlayerError(ev.detail); });
  controls.addEventListener('error', function(ev) { onPlayerError(ev.detail); });
  video.addEventListener('error', function() { onPlayerError(video.error); });

  ui.configure({
    controlPanelElements: [
      "play_pause", "mute", "volume", "spacer",
      "time_and_duration", "quality", "fullscreen", "overflow_menu"
    ]
  });

  player.configure({
    drm: {
      clearKeys: {
        "69a5aa835a061ce64a630d1046727e40": "d02feac8a999bd06bf4059bf33411749"
      }
    },
    streaming: {
      bufferingGoal: 20,
      rebufferingGoal: 2,
      bufferBehind: 20
    }
  });

  try {
    await player.load("https://otte.cache.aiv-cdn.net/iad-nitro/live/clients/dash/enc/rhf2dwosdt/out/v1/ee550d2a68d846c797e6ce4de2e8b76d/cenc.mpd");
    video.muted = false;
    video.play().catch(function(){});
  } catch (e) {
    onPlayerError(e);
  }
}

function initFailed() {
  silentLog('Unable to load Shaka UI');
}

document.addEventListener('shaka-ui-loaded', initPlayer);
document.addEventListener('shaka-ui-load-failed', initFailed);

if ('wakeLock' in navigator) {
  navigator.wakeLock.request('screen').catch(function(){});
}
</script>
</body>
</html>
