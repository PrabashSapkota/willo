<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>HELLO WORLD</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/controls.css" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/shaka-player.ui.js" crossorigin="anonymous"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box }
html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; user-select: none; -webkit-user-select: none; }
.video-container, #player-wrap { position: absolute; inset: 0; background: #000 }
#video { width: 100%; height: 100% }
.shaka-spinner-container, .shaka-buffering-spinner, .shaka-spinner { display: none !important }
</style>
</head>
<body>
<div class="video-container">
  <div id="player-wrap" data-shaka-player-container>
    <video autoplay muted playsinline data-shaka-player id="video"></video>
  </div>
</div>
<script>
// Optional: light protection (remove completely while debugging)
document.addEventListener('contextmenu', function(e) {
  e.preventDefault();
}, false);

document.addEventListener('keydown', function(e) {
  if (e.key === 'F12' || e.keyCode === 123) {
    e.preventDefault();
    return false;
  }
  if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c' || e.key === 'K' || e.key === 'k')) {
    e.preventDefault();
    return false;
  }
  if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) {
    e.preventDefault();
    return false;
  }
  if (e.metaKey && e.altKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'U' || e.key === 'u')) {
    e.preventDefault();
    return false;
  }
}, false);

function onPlayerError(error) {
  // Log to console so you can see real errors while testing
  console.error('Shaka Player Error:', error);
}

async function initPlayer() {
  if (!window.shaka || !shaka.Player || !shaka.Player.isBrowserSupported()) {
    console.error('Browser not supported by Shaka Player');
    return;
  }

  shaka.polyfill.installAll();

  var video = document.getElementById('video');
  if (!video || !video.ui) {
    setTimeout(initPlayer, 80);
    return;
  }

  var ui = video.ui;
  var controls = ui.getControls();
  var player = controls.getPlayer();

  player.addEventListener('error', function(ev) {
    onPlayerError(ev.detail);
  });
  controls.addEventListener('error', function(ev) {
    onPlayerError(ev.detail);
  });
  video.addEventListener('error', function() {
    onPlayerError(video.error);
  });

  // UI configuration
  ui.configure({
    controlPanelElements: [
      "play_pause",
      "mute",
      "volume",
      "spacer",
      "time_and_duration",
      "quality",
      "fullscreen",
      "overflow_menu"
    ]
  });

  // Player + DRM configuration
  player.configure({
    drm: {
      clearKeys: {
        "82dfca238e8c4b430a3269db71965db9": "a00b28caf4ac628e77a553d440c0ddca"
      }
    },
    streaming: {
      bufferingGoal: 20,
      rebufferingGoal: 2,
      bufferBehind: 20
    }
  });

  try {
    // IMPORTANT: Keep the video muted for reliable autoplay inside iframes
    video.muted = true;

    await player.load("https://otte.cache.aiv-cdn.net/iad-nitro/live/clients/dash/enc/b3b3fkmrbl/out/v1/1084d5c9a97a4c5b9f9554c88f486646/cenc.mpd");

    // Start playback (still muted). User can unmute via the Shaka volume button.
    video.play().catch(function(err) {
      console.warn('Autoplay was blocked or failed:', err);
    });

  } catch (e) {
    onPlayerError(e);
  }
}

function initFailed() {
  console.error('Unable to load Shaka UI');
}

document.addEventListener('shaka-ui-loaded', initPlayer);
document.addEventListener('shaka-ui-load-failed', initFailed);

// Optional: keep screen awake
if ('wakeLock' in navigator) {
  navigator.wakeLock.request('screen').catch(function(){});
}
</script>
</body>
</html>
